name: PR Review

# Dogfoods the composite action on this repo's own PRs. Other repos consume the
# same action via `uses: <owner>/agents/actions/pr-review@v1` — see
# actions/pr-review/README.md and examples/consumer-workflow.yml.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./actions/pr-review
        # There is no default provider: the model is required and its
        # credentials come from the environment.
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          pr-number: ${{ github.event.pull_request.number }}
          model: cloudflare-workers-ai/@cf/moonshotai/kimi-k2.6
