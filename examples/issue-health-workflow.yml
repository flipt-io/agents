# Copy this into a consuming repo as `.github/workflows/issue-health.yml`.
# Replace flipt-io/agents with the org/user and repo that hosts the agents repo
# if you run a fork.
#
# There is no default model or default provider: `model` is required, and the
# provider's credentials go through `env:` on the calling step (not action
# inputs). The issue comment and existing-label application use `issues: write`.
name: Issue Health Check

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  issue-health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4 # so the agent can see this repo's .agents/ overrides

      # --- Kimi K2.6 on Cloudflare Workers AI --------------------------------
      # Add CLOUDFLARE_API_KEY (a token with `Workers AI` → Read scope) and
      # CLOUDFLARE_ACCOUNT_ID as repo secrets.
      # @v1 tracks the latest 1.x (no breaking input changes); @v1.0.0 freezes
      # the code and the analysis prompts; @main is the unreleased tip.
      - uses: flipt-io/agents/actions/issue-health@v1
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          issue-number: ${{ github.event.issue.number }}
          model: cloudflare-workers-ai/@cf/moonshotai/kimi-k2.6
          # Optional:
          # comment-mode: always          # always | needs-improvement | off
          # label-mode: existing-only     # existing-only | off; never creates labels
          # override-mode: merge          # or: replace
          # local-config-dir: .agents/issue-health # isolate this agent's prompts from other agents

      # --- Or use Anthropic --------------------------------------------------
      # Add ANTHROPIC_API_KEY as a repo secret and use this step instead.
      #
      # - uses: flipt-io/agents/actions/issue-health@v1
      #   env:
      #     ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      #   with:
      #     issue-number: ${{ github.event.issue.number }}
      #     model: anthropic/claude-sonnet-4-6
