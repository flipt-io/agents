# Copy this into a consuming repo as `.github/workflows/pr-review.yml`.
# Replace <owner> with the org/user that hosts the agents repo.
#
# There is no default model or default provider: `model` is required, and the
# provider's credentials go through `env:` on the calling step (not action
# inputs) — pi-ai reads them from the inherited process environment. The example
# below runs Kimi K2.6 on Cloudflare Workers AI; an Anthropic variant is at the
# bottom.
name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4 # so the agent can see this repo's .agents/ overrides

      # --- Kimi K2.6 on Cloudflare Workers AI --------------------------------
      # 262k context window, reasoning, vision, tool calling.
      # Add CLOUDFLARE_API_KEY (a token with `Workers AI` → Read scope) and
      # CLOUDFLARE_ACCOUNT_ID as repo secrets.
      # @v1 tracks the latest 1.x (no breaking input changes); @v1.0.0 freezes
      # the code and the review prompts; @main is the unreleased tip.
      - uses: <owner>/agents/actions/pr-review@v1
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          pr-number: ${{ github.event.pull_request.number }}
          model: cloudflare-workers-ai/@cf/moonshotai/kimi-k2.6
          # Optional:
          # override-mode: merge           # or: replace
          # local-config-dir: .agents/pr-review # isolate this agent's prompts from other agents

      # --- Or review with Anthropic ------------------------------------------
      # Add ANTHROPIC_API_KEY as a repo secret and use this step instead.
      #
      # - uses: <owner>/agents/actions/pr-review@v1
      #   env:
      #     ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      #   with:
      #     pr-number: ${{ github.event.pull_request.number }}
      #     model:     anthropic/claude-sonnet-4-6
